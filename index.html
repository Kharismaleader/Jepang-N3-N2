<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Sengaja TANPA meta mode standalone iOS: shortcut Home Screen harus membuka tab Safari biasa, bukan wadah terpisah (mengikuti revisi terakhir Kantong-Yen). -->
<meta name="theme-color" content="#0E5F56">
<title>Daily Japan</title>
<style>
:root{--teal:#0E5F56;--teal2:#0E7C86;--orange:#F28C28;--bg:#F2F7F5;--card:#fff;--ink:#17302C;--mute:#64756F;--line:#DCE8E3;--chip:#EAF3F0;--ok:#2E7D4F;--bad:#C93A4F;--warn:#FFF3E2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%;line-height:1.5}
button,input,select{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:14px 16px 112px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 2px 8px rgba(14,95,86,.25);flex:none}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px}
.top h1 span{color:var(--teal)}
.hbtns{display:flex;gap:6px;flex:none}
.hbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 11px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:38px}
.hbtn:active{transform:scale(.97)}
.status{font-size:12px;color:var(--mute);margin:2px 2px 12px;display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}
.hero{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"日本語";position:absolute;right:-4px;top:-14px;font-size:76px;font-weight:900;opacity:.10;pointer-events:none}
.hero small{display:block;opacity:.85;font-size:13px}
.hero h2{margin:4px 0 6px;font-size:21px;line-height:1.3}
.hero p{margin:0;font-size:14px;opacity:.95}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card h2,.card h3{margin:0 0 10px;font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;min-height:52px}
.btn.pri{background:var(--orange);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:var(--chip);color:var(--teal)}
.btn+.btn{margin-top:9px}
.btn:active{transform:scale(.98)}
.prog{margin:12px 0 4px}
.prow{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:5px}
.pbar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--chip);border-radius:99px;padding:7px 11px;font-size:13px}
.chip b{color:var(--teal)}
.chip.done{background:#E3F2E7;color:var(--ok)}
.mini{font-size:13px;color:var(--mute);line-height:1.6}
select,input[type=search]{width:100%;border:0;background:var(--chip);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;min-height:48px;margin-bottom:12px}
.gcard{border:1.5px solid var(--teal);border-radius:16px;margin-bottom:11px;overflow:hidden;background:#F8FBFA}
.ghead{width:100%;display:flex;gap:10px;align-items:flex-start;background:none;border:0;padding:14px;text-align:left;cursor:pointer;min-height:52px}
.ghead .pat{flex:1;font-size:18px;font-weight:800;color:var(--teal)}
.ghead .lvl{background:var(--teal);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:3px 8px;flex:none;margin-top:3px}
.ghead .lvl.n2{background:var(--orange)}
.ghead .arr{color:var(--mute);flex:none;margin-top:4px}
.gbody{padding:0 14px 14px;font-size:14.5px;display:none}
.gcard.open .gbody{display:block}
.gbody p{margin:7px 0}
.gbody .lbl{font-weight:800;color:var(--teal);font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
.ex{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:7px 0}
.ex .jp{font-size:15.5px}
.ex .id{color:var(--mute);font-size:13.5px}
.check{border:1.5px solid var(--teal);background:#fff;color:var(--teal);border-radius:99px;padding:9px 14px;font-weight:800;font-size:13.5px;cursor:pointer;min-height:44px}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.vrow{display:flex;gap:11px;align-items:flex-start;padding:12px 2px;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:0}
.vrow .w{flex:1;min-width:0}
.vrow .w b{font-size:17px}
.vrow .w .rd{color:var(--teal2);font-size:13px;font-weight:700}
.vrow .w .mn{font-size:14px}
.vrow .w .ex2{font-size:13px;color:var(--mute)}
.flash{border:1.5px solid var(--teal2);border-radius:16px;padding:20px 16px;text-align:center;cursor:pointer;background:#F8FBFA;margin-bottom:11px;min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:5px;width:100%}
.flash .fw{font-size:24px;font-weight:800}
.flash .fr{color:var(--teal2);font-weight:700}
.flash .fm{font-size:16px;display:none}
.flash.flip .fm{display:block}
.flash .hint{font-size:12px;color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:11px;padding:11px;font-weight:800;cursor:pointer;color:var(--mute);min-height:46px}
.seg button.on{background:var(--teal);color:#fff}
.bubble{max-width:88%;border-radius:18px;padding:11px 14px;margin-bottom:10px;font-size:15px}
.bubble .sp{font-size:12px;font-weight:800;color:var(--teal);margin-bottom:3px}
.bubble .bid{font-size:13px;color:var(--mute);margin-top:4px}
.bubble.a{background:var(--chip);margin-right:auto;border-bottom-left-radius:6px}
.bubble.b{background:#FFF0DD;margin-left:auto;border-bottom-right-radius:6px}
.tips{background:#EAF5EC;border:1.5px solid var(--ok);border-radius:16px;padding:14px 16px;font-size:14.5px;margin-bottom:14px}
.qopt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:15.5px;cursor:pointer;margin-bottom:9px;min-height:52px}
.qopt.sel-ok{border-color:var(--ok);background:#EAF7EE;font-weight:700}
.qopt.sel-bad{border-color:var(--bad);background:#FDECEF}
.qopt.dim{opacity:.65}
.qexp{background:var(--warn);border:1.5px solid var(--orange);border-radius:14px;padding:12px 14px;font-size:14.5px;margin:10px 0}
.score{text-align:center;padding:10px 0}
.score b{display:block;font-size:44px;color:var(--teal)}
.arow{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;min-height:60px}
.arow .t{flex:1;min-width:0}
.arow .t b{display:block;font-size:15px}
.arow .t span{font-size:12.5px;color:var(--mute)}
.arow .st{font-size:12px;font-weight:800;color:var(--orange);flex:none;text-align:right}
.arow .st.done{color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:30px 18px;line-height:1.7;font-size:14.5px}
.empty b{display:block;font-size:30px;margin-bottom:6px}
.bnav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:10}
.bnav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bnav button{border:0;background:none;border-radius:14px;padding:8px 2px;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer;min-height:52px}
.bnav button .ic{display:block;font-size:21px;line-height:1.2}
.bnav button.on{color:var(--teal);background:var(--chip)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-90px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;transition:transform .25s;z-index:30;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}

.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.lvcard{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px 13px;text-align:left;cursor:pointer;min-height:86px}
.lvcard b{display:block;font-size:17px;color:var(--teal);margin-bottom:3px}
.lvcard span{font-size:12.5px;color:var(--mute);line-height:1.45;display:block}
.lvcard.on{border-color:var(--teal);background:#EAF5F1;box-shadow:0 3px 10px rgba(14,95,86,.18)}
.lvcard.on b::after{content:" ✓";color:var(--ok)}
.lvcard:active{transform:scale(.98)}
.abtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);font-size:15px;cursor:pointer;flex:none;vertical-align:middle;padding:0}
.abtn:active{transform:scale(.92)}
.abtn.wide{width:auto;border-radius:99px;padding:0 14px;height:38px;font-weight:700;font-size:13.5px;color:var(--teal)}
.audiorow{display:flex;gap:8px;margin:-4px 0 12px}
.ex .abtn{float:right;margin:0 0 4px 8px}
.bubble .abtn{float:right;margin:0 0 4px 8px}
.vrow .w .abtn{margin-left:2px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><img class="avatar" src="hasian.gif" alt="Hasian" width="40" height="40" onerror="this.style.display='none'"><h1>Daily Japan</h1></div>
    <div class="hbtns">
      <button class="hbtn" id="btnKey">Kode akses</button>
      <button class="hbtn" id="btnSync">↻ Sinkronkan</button>
    </div>
  </div>
  <p class="status"><i></i><span id="srcLabel">Memuat data…</span></p>

  <!-- BERANDA -->
  <section id="view-home"></section>

  <!-- MATERI -->
  <section id="view-materi" hidden>
    <label class="mini" for="dateSel">Pilih tanggal materi</label>
    <select id="dateSel" aria-label="Pilih tanggal materi"></select>
    <div id="materiBody"></div>
  </section>

  <!-- QUIZ -->
  <section id="view-quiz" hidden>
    <label class="mini" for="quizDateSel">Quiz untuk tanggal</label>
    <select id="quizDateSel" aria-label="Pilih tanggal quiz"></select>
    <div id="quizBody"></div>
  </section>

  <!-- ARSIP -->
  <section id="view-arsip" hidden>
    <input type="search" id="searchBox" placeholder="Cari tema, grammar, atau vocab…" aria-label="Cari di arsip">
    <div id="arsipBody"></div>
  </section>
</main>

<nav class="bnav" aria-label="Navigasi utama"><div class="bnav-in">
  <button data-view="home" class="on"><span class="ic">🏠</span>Beranda</button>
  <button data-view="materi"><span class="ic">📖</span>Materi</button>
  <button data-view="quiz"><span class="ic">📝</span>Quiz</button>
  <button data-view="arsip"><span class="ic">🗂️</span>Arsip</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   SINKRONISASI — DUA Sheet lewat Apps Script Web App
   ------------------------------------------------------------
   Aplikasi ini punya DUA level, masing-masing dengan Sheet
   dan URL Web App sendiri:
   - Level N3–N2: Sheet "Materi"      → SYNC_URL (terisi)
   - Level N5–N4: Sheet "Materi N5-N4" → SYNC_URL_N5N4 (di bawah)
   Selama URL suatu level masih kosong (""), level itu memakai
   file seed-nya (seed.json / seed-n5n4.json) di folder/repo
   yang sama sebagai cadangan; khusus N3–N2 ada data contoh
   bawaan bila seed pun tidak ada, sedangkan N5–N4 menampilkan
   pesan "sedang disiapkan".
   Kode akses dimasukkan sekali per perangkat lewat tombol
   "Kode akses", hanya disimpan di perangkat ini, dan SATU kode
   yang sama dipakai untuk kedua endpoint (?key=).
   ============================================================ */
const SYNC_URL = "https://script.google.com/macros/s/AKfycbzM9aTf6KzwZ7FBTE-5Qd2mTCYLbXV5DDA6Kohn6BOhzfJPDHHGlQf4TZJj4-XuWuU2/exec";

/* ------------------------------------------------------------
   LEVEL KEDUA: N5–N4 (untuk istri, pemula)
   ------------------------------------------------------------
   SYNC_URL_N5N4 di bawah ini adalah URL Web App Apps Script
   yang terhubung ke Google Sheet "Materi N5-N4".
   >>> URL ini AKAN DIISI OLEH AGEN UTAMA setelah Web App
       Sheet "Materi N5-N4" di-deploy. Selama masih kosong (""),
       level N5–N4 memakai seed-n5n4.json sebagai cadangan,
       dan bila itu pun belum ada, aplikasi menampilkan pesan
       ramah "Materi N5–N4 sedang disiapkan" (bukan error).
   Kode akses tetap SATU kode yang sama untuk kedua endpoint.
   ------------------------------------------------------------ */
const SYNC_URL_N5N4 = "https://script.google.com/macros/s/AKfycbzm9RBFLmpp0I0gTuW8vsfrO7otfPaZhkWXjYmlu3AwKy1oRFAvde5jgXWUfNrk0vNj/exec";

/* Dua level belajar yang didukung aplikasi. Data, cache,
   progres, dan skor quiz disimpan TERPISAH per level. */
const LEVELS = [
  {id:"n3n2", label:"N3–N2", syncUrl:SYNC_URL, seedFile:"seed.json",
   desc:"Untuk saya — kerja, bisnis & target JLPT N2"},
  {id:"n5n4", label:"N5–N4", syncUrl:SYNC_URL_N5N4, seedFile:"seed-n5n4.json",
   desc:"Untuk istri — pemula, percakapan sehari-hari"}
];
const LS_LEVEL = "jpn.level";

const LS_KEY = "jepang-n3n2-key";
const LS_CACHE = "jepang-n3n2-cache-v1";
const LS_PROG = "jepang-n3n2-progress-v1";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("toast");t.textContent=m;t.className="toast on";clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="toast",2200)}

/* ---------- Audio: text-to-speech Bahasa Jepang (Web Speech API) ---------- */
/* Catatan iOS Safari (perbaikan 2026-11-08): memanggil cancel() TEPAT sebelum
   speak() dalam tugas yang sama membuat ucapan baru dibuang diam-diam oleh
   WebKit (tidak ada suara sama sekali). Karena itu: cancel HANYA bila memang
   sedang ada ucapan/antrian, lalu beri jeda singkat sebelum bicara; bila
   sedang diam, langsung bicara sinkron di dalam gestur ketuk pengguna.
   Suara ja-JP juga dipilih eksplisit bila tersedia (daftar suara iOS termuat
   asinkron lewat event voiceschanged), dan resume() dipanggil untuk bug
   status "paused" di iOS. */
let jaVoice=null;
function loadVoices(){
  try{
    const vs=(window.speechSynthesis.getVoices()||[]).filter(v=>/^ja([-_]|$)/i.test(v.lang||""));
    if(!vs.length){jaVoice=null;return}
    // Pilih suara Jepang PALING natural yang tersedia di perangkat:
    // varian Enhanced/Premium iOS > Google Jepang (Chrome) > Kyoko > Otoya.
    const score=v=>{
      const n=((v.name||"")+" "+(v.voiceURI||"")).toLowerCase();
      let s=0;
      if(/enhanced|premium|neural|natural/.test(n)) s+=40;
      if(/google/.test(n)) s+=30;
      if(/kyoko/.test(n)) s+=20;
      if(/otoya/.test(n)) s+=10;
      if(v.default) s+=5;
      if(/compact|eloquence|novelty/.test(n)) s-=30;
      return s;
    };
    jaVoice=vs.slice().sort((a,b)=>score(b)-score(a))[0];
  }catch(e){}
}
if("speechSynthesis" in window){
  loadVoices();
  try{window.speechSynthesis.addEventListener("voiceschanged",loadVoices)}catch(e){}
}
function speak(text){
  const t=String(text??"").trim();
  if(!t) return;
  if(!("speechSynthesis" in window)){toast("Audio tidak tersedia di browser ini");return}
  const synth=window.speechSynthesis;
  const doSpeak=()=>{
    try{
      const u=new SpeechSynthesisUtterance(t);
      u.lang="ja-JP";
      // Kalimat & dialog memakai tempo natural penutur asli (1.0) agar fasih;
      // kata tunggal sedikit lebih lambat (0.88) agar pengucapannya jelas.
      u.rate=(t.length>10||/。|、/.test(t))?1.0:0.88;
      u.pitch=1;
      u.volume=1;
      if(jaVoice) u.voice=jaVoice;
      u.onerror=ev=>{if(ev&&(ev.error==="language-unavailable"||ev.error==="voice-unavailable"))toast("Suara Bahasa Jepang belum terpasang di perangkat ini")};
      synth.speak(u);
      if(synth.paused) synth.resume();
    }catch(e){toast("Audio tidak tersedia di browser ini")}
  };
  try{
    if(synth.speaking||synth.pending){synth.cancel();setTimeout(doSpeak,90)}
    else doSpeak();
  }catch(e){doSpeak()}
}
function stopSpeak(){if("speechSynthesis" in window){try{window.speechSynthesis.cancel()}catch(e){}}}
/* Tombol 🔊 memakai atribut data-speak. Listener tangkap (capture) +
   stopPropagation supaya tombol audio TIDAK ikut membuka/menutup kartu. */
document.addEventListener("click",e=>{
  const b=e.target.closest?e.target.closest("[data-speak]"):null;
  if(!b) return;
  e.stopPropagation();
  speak(b.dataset.speak);
},true);
/* Kartu pemilih level memakai atribut data-lv (delegasi klik). */
document.addEventListener("click",e=>{
  const b=e.target.closest?e.target.closest("[data-lv]"):null;
  if(!b) return;
  setLevel(b.dataset.lv);
});
function fmtDate(iso){
  if(!iso) return "";
  const p=String(iso).slice(0,10).split("-");
  if(p.length!==3) return String(iso);
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function fmtShort(iso){
  const p=String(iso||"").slice(0,10).split("-");
  if(p.length!==3) return String(iso||"");
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
}

/* ---------- Data contoh bawaan (fallback demo terakhir) ---------- */
const DUMMY = {ok:true,materi:[{
  date:"2026-11-07", theme:"Keluarga & Kehidupan Sehari-hari — Data Contoh",
  context:"Keluarga", target:"Contoh tampilan: hafalkan pola memberi/menerima bantuan dan vocab rutinitas rumah di bawah ini.",
  tips:"Baca ringkasan 2 menit, ucapkan contohnya keras-keras, lalu kerjakan quiz contohnya.",
  pdf:"",
  grammar:[
    {no:1,level:"N3",pattern:"～てあげる・～てくれる・～てもらう",romaji:"te ageru / te kureru / te morau",meaning:"memberi / diberi bantuan (siapa menolong siapa)",formation:"Kata kerja bentuk て + あげる / くれる / もらう",nuance:"～てあげる = saya menolong orang lain; ～てくれる = orang lain menolong saya; ～てもらう = saya menerima bantuan.",examples:[{jp:"妻が夕食を作ってくれました。",id:"Istri saya memasakkan makan malam untuk saya."}]},
    {no:2,level:"N3",pattern:"～ようになる",romaji:"you ni naru",meaning:"menjadi bisa / akhirnya bisa (perubahan keadaan)",formation:"Kata kerja bentuk kamus + ようになる",nuance:"Menekankan proses perubahan: dulu tidak bisa, sekarang bisa.",examples:[{jp:"子どもが一人で着替えられるようになりました。",id:"Anak sekarang sudah bisa ganti baju sendiri."}]}
  ],
  vocab:[
    {no:1,word:"洗濯",reading:"せんたく",meaning:"mencuci pakaian",example_jp:"洗濯物を干してください。",example_id:"Tolong jemur cuciannya."},
    {no:2,word:"寝かしつけ",reading:"ねかしつけ",meaning:"menidurkan anak",example_jp:"寝かしつけが大変でした。",example_id:"Menidurkan anak itu berat."},
    {no:3,word:"おむつ",reading:"おむつ",meaning:"popok",example_jp:"おむつを替えてください。",example_id:"Tolong ganti popoknya."}
  ],
  dialog:[
    {no:1,speaker:"Tota",jp:"ただいま。",id:"Aku pulang."},
    {no:2,speaker:"Istri",jp:"おかえりなさい。",id:"Selamat datang."}
  ],
  quiz:[

    {no:2,type:"Vocab",question:"「寝かしつけ」artinya…",options:["mencuci pakaian","menidurkan anak","membuang sampah","bangun pagi"],answer:1,explanation:"寝かしつけ (nekashitsuke) artinya menidurkan anak."}

/* ---------- State ---------- */
let DATA = {materi:[]};
let sourceKind = "contoh"; // sheet | seed | cache | contoh
let selectedDate = "";
let quizDate = "";
let quizState = null; // {date, idx, answers:{}, finished}
let vocabMode = "list"; // list | flash
const flipped = new Set();

/* ---------- Level aktif (N3–N2 / N5–N4) ---------- */
function levelOf(id){return LEVELS.find(L=>L.id===id)||LEVELS[0]}
function storedLevel(){try{const v=localStorage.getItem(LS_LEVEL);return LEVELS.some(L=>L.id===v)?v:"n3n2"}catch(e){return "n3n2"}}
let levelId = storedLevel();
let levelFetched = false; // apakah level aktif sudah pernah dimuat dari Sheet/seed
const LVSTATE = {}; // snapshot state per level, agar berpindah level tidak mengacak data/progres
function LEVEL(){return levelOf(levelId)}
function snapshotLevel(){
  LVSTATE[levelId]={data:DATA,source:sourceKind,selectedDate,quizDate,quizState,vocabMode,fetched:levelFetched};
}
function restoreLevel(id){
  const s=LVSTATE[id]||{data:{materi:[]},source:"contoh",selectedDate:"",quizDate:"",quizState:null,vocabMode:"list",fetched:false};
  DATA=s.data; sourceKind=s.source; selectedDate=s.selectedDate; quizDate=s.quizDate;
  quizState=s.quizState; vocabMode=s.vocabMode; levelFetched=s.fetched;
}
function updateHeaderLevel(){
  // Judul app tetap "Daily Japan" untuk kedua level (permintaan Tota
  // 2026-11-08: tombol badge level di header dihapus agar desain bersih).
  document.title="Daily Japan";
}
function setLevel(id){
  if(!LEVELS.some(L=>L.id===id)) id="n3n2";
  stopSpeak();
  if(id!==levelId){
    snapshotLevel();
    levelId=id;
    try{localStorage.setItem(LS_LEVEL,id)}catch(e){}
    restoreLevel(id);
    flipped.clear();
  }
  updateHeaderLevel();
  if(!levelFetched){
    loadCache();
    $("srcLabel").textContent=srcText();
    renderAll();
    loadData(false);
  } else {
    $("srcLabel").textContent=srcText();
    renderAll();
  }
}

function getKey(){try{return localStorage.getItem(LS_KEY)||""}catch(e){return ""}}
function setKey(k){try{localStorage.setItem(LS_KEY,k)}catch(e){}}
/* Kunci penyimpanan per level: progres & cache Tota (n3n2) memakai kunci lama
   agar data yang sudah tersimpan tidak hilang; level lain memakai suffix id level. */
function progKey(){return levelId==="n3n2"?LS_PROG:"jepang-"+levelId+"-progress-v1"}
function cacheKey(){return levelId==="n3n2"?LS_CACHE:"jepang-"+levelId+"-cache-v1"}
function loadProg(){try{return JSON.parse(localStorage.getItem(progKey())||"{}")}catch(e){return {}}}
function saveProg(p){try{localStorage.setItem(progKey(),JSON.stringify(p))}catch(e){}}
function progOf(date){const p=loadProg();return p[date]||{grammar:{},vocab:{},quizBest:null,quizLast:null}}
function setProg(date,fn){const p=loadProg();const cur=p[date]||{grammar:{},vocab:{},quizBest:null,quizLast:null};fn(cur);p[date]=cur;saveProg(p)}
function sortedMateri(){return [...(DATA.materi||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function materiOf(date){return sortedMateri().find(m=>m.date===date)||null}
function counts(m){if(!m)return{g:0,v:0,gd:0,vd:0};const pr=progOf(m.date);return{g:(m.grammar||[]).length,v:(m.vocab||[]).length,gd:Object.keys(pr.grammar||{}).filter(k=>pr.grammar[k]).length,vd:Object.keys(pr.vocab||{}).filter(k=>pr.vocab[k]).length}}
function srcText(){
  if(levelId==="n5n4" && !sortedMateri().length) return "Materi N5–N4 sedang disiapkan 🌸";
  const latest = sortedMateri()[0];
  if(sourceKind==="sheet") return "Data: Sheet • " + (latest?fmtShort(latest.date):"");
  if(sourceKind==="seed") return "Data "+LEVEL().label+": cadangan ("+LEVEL().seedFile+")" + (latest?" • "+fmtShort(latest.date):"");
  if(sourceKind==="cache") return "Data: tersimpan di HP" + (latest?" • "+fmtShort(latest.date):"") + " — ketuk Sinkronkan untuk terbaru";
  return "Data contoh — hubungkan Sheet untuk materi asli";
}

/* ---------- Muat data: cache -> Sheet -> seed.json -> dummy ---------- */
function applyData(json,kind){
  if(!json || !Array.isArray(json.materi) || !json.materi.length) return false;
  DATA = json; sourceKind = kind;
  const list = sortedMateri();
  if(!materiOf(selectedDate)) selectedDate = list[0].date;
  if(!materiOf(quizDate)) quizDate = selectedDate;
  $("srcLabel").textContent = srcText();
  renderAll();
  return true;
}
function loadCache(){
  try{const c=JSON.parse(localStorage.getItem(cacheKey())||"null");if(c&&c.data)return applyData(c.data,"cache")}catch(e){}
  return false;
}
function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({data:DATA,at:Date.now()}))}catch(e){}}
async function fetchJson(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("http "+r.status);return r.json()}
async function loadData(manual){
  const L = LEVEL(), myLevel = L.id;
  if(manual) $("srcLabel").textContent = "Menyinkronkan…";
  // (2) Sheet level ini lewat Apps Script, bila URL terisi & kode akses ada
  if(L.syncUrl && getKey()){
    try{
      const j = await fetchJson(L.syncUrl + "?key=" + encodeURIComponent(getKey()));
      if(myLevel!==levelId) return; // level sudah berganti selama memuat
      if(j && j.ok!==false && applyData(j,"sheet")){saveCache();levelFetched=true;if(manual)toast("Sinkron selesai — data "+L.label+" dari Sheet");return}
    }catch(e){/* lanjut ke cadangan */}
  } else if(manual && L.syncUrl && !getKey()){
    toast("Isi Kode akses dulu, ya");
  }
  // (3) file seed relatif milik level ini
  try{
    const j = await fetchJson(L.seedFile);
    if(myLevel!==levelId) return;
    if(applyData(j,"seed")){levelFetched=true;if(manual)toast("Menampilkan data cadangan ("+L.seedFile+")");return}
  }catch(e){/* lanjut ke dummy / pesan kosong */}
  levelFetched = true;
  // (4) dummy contoh hanya untuk N3–N2; level N5–N4 yang belum punya data
  //     dibiarkan kosong dan menampilkan pesan "sedang disiapkan".
  if(L.id==="n3n2" && (sourceKind!=="cache" || !DATA.materi.length)){applyData(JSON.parse(JSON.stringify(DUMMY)),"contoh")}
  if(manual){
    if(L.id==="n5n4" && !sortedMateri().length) toast("Materi N5–N4 sedang disiapkan 🌸");
    else toast("Sheet belum terhubung — menampilkan data cadangan/contoh");
  }
  $("srcLabel").textContent = srcText();
  renderAll();
}

function renderVocab(m){

/* ---------- Render: Quiz (satu soal per layar) ---------- */
function renderQuiz(){
  fillDateSelects();
  const m = materiOf(quizDate||selectedDate), el=$("quizBody");
  if(!m){el.innerHTML='<div class="card empty">'+(sortedMateri().length?'<b>📝</b>Quiz belum tersedia.':noDataMsg())+'</div>';return}
  const qs = m.quiz||[];
  if(!qs.length){el.innerHTML='<div class="card empty"><b>📝</b>Quiz belum tersedia untuk tanggal ini.<br>Quiz biasanya dibuat malam hari setelah materinya terbit. Coba lagi nanti, ya.</div>';return}
  if(!quizState || quizState.date!==m.date) quizState={date:m.date,idx:0,answers:{},finished:false};
  const st=quizState, pr=progOf(m.date);
  if(st.finished){
    const score=qs.reduce((s,q,i)=>s+(st.answers[i]===q.answer?1:0),0);
    el.innerHTML='<div class="card score"><p class="mini">Quiz selesai — '+esc(fmtShort(m.date))+'</p><b>'+score+' / '+qs.length+'</b>'+
      '<p class="mini">Skor terbaik untuk tanggal ini: '+(pr.quizBest===null||pr.quizBest===undefined?score:pr.quizBest)+' / '+qs.length+'</p>'+
      '<button class="btn pri" id="qRetry">↻ Ulangi Quiz</button><button class="btn ghost" id="qReview">Lihat Materi Lagi</button></div>';
    $("qRetry").onclick=()=>{quizState={date:m.date,idx:0,answers:{},finished:false};renderQuiz()};
    $("qReview").onclick=()=>{selectedDate=m.date;go("materi")};
    return;
  }
  const i=st.idx, q=qs[i], picked=st.answers[i];
  const answered = picked!==undefined;
  let h='<div class="card"><div class="prow" style="display:flex;justify-content:space-between"><span class="mini">Soal '+(i+1)+' dari '+qs.length+(q.type?' • '+esc(q.type):'')+'</span><span class="mini">Terbaik: '+(pr.quizBest===null||pr.quizBest===undefined?"—":pr.quizBest)+'</span></div>'+
    '<div class="pbar" style="margin-bottom:14px"><i style="width:'+((i)/qs.length*100)+'%"></i></div>'+
    '<h3 style="font-size:17px;line-height:1.5">'+esc(q.question)+'</h3>'+
    (q.options||[]).map((op,oi)=>{
      let cls="";
      if(answered){ if(oi===q.answer)cls="sel-ok"; else if(oi===picked)cls="sel-bad"; else cls="dim"; }
      return '<button class="qopt '+cls+'" data-opt="'+oi+'">'+esc(String.fromCharCode(65+oi))+". "+esc(op)+'</button>';
    }).join("")+
    (answered?'<div class="qexp">'+(picked===q.answer?"✅ <b>Benar!</b> ":"❌ <b>Belum tepat.</b> Jawaban benar: <b>"+esc((q.options||[])[q.answer]||"")+"</b>. ")+esc(q.explanation||"")+'</div>'+
      '<button class="btn pri" id="qNext">'+(i+1>=qs.length?"Lihat Hasil":"Soal Berikutnya ›")+'</button>':'')+
    '</div>';
  el.innerHTML=h;
  el.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    if(st.answers[i]!==undefined) return;
    st.answers[i]=+b.dataset.opt; renderQuiz();
  });
  const nx=$("qNext");
  if(nx) nx.onclick=()=>{
    if(i+1>=qs.length){
      st.finished=true;
      const score=qs.reduce((s,qq,ii)=>s+(st.answers[ii]===qq.answer?1:0),0);
      setProg(m.date,p=>{p.quizLast=score;if(p.quizBest===null||p.quizBest===undefined||score>p.quizBest)p.quizBest=score});
    } else st.idx++;
    renderQuiz(); renderHome();
  };
}

/* ---------- Render: Arsip + pencarian ---------- */
$("searchBox").addEventListener("input",()=>renderArsip());
function renderArsip(){
  const q=($("searchBox").value||"").trim().toLowerCase(), el=$("arsipBody");
  let list=sortedMateri();
  if(q) list=list.filter(m=>{
    const hay=[m.theme||"",m.context||"",
      ...(m.grammar||[]).map(g=>(g.pattern||"")+" "+(g.meaning||"")),
      ...(m.vocab||[]).map(v=>(v.word||"")+" "+(v.meaning||""))].join(" ").toLowerCase();
    return hay.includes(q);
  });
  if(!list.length){el.innerHTML=levelSwitchHtml()+'<div class="card empty">'+(q?'<b>🗂️</b>Tidak ada materi yang cocok dengan pencarian itu.':noDataMsg())+'</div>';return}
  el.innerHTML=levelSwitchHtml()+list.map(m=>{
    const c=counts(m), pr=progOf(m.date);
    const done=(c.g&&c.gd>=c.g)&&(c.v&&c.vd>=c.v);
    return '<button class="arow" data-date="'+esc(m.date)+'"><span class="t"><b>'+esc(fmtShort(m.date))+' — '+esc(m.theme||"")+'</b><span>'+esc(m.context||"")+' • Grammar '+c.gd+'/'+c.g+' • Vocab '+c.vd+'/'+c.v+(pr.quizBest!==null&&pr.quizBest!==undefined?" • Quiz terbaik "+pr.quizBest:"")+'</span></span><span class="st '+(done?"done":"")+'">'+(done?"✓ Tuntas":"Buka ›")+'</span></button>';
  }).join("");
  el.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;quizDate=b.dataset.date;quizState=null;go("materi")});
}

function renderAll(){
  renderHome(); renderMateri(); renderQuiz(); renderArsip();
  // kembalikan tampilan aktif setelah render ulang
  ["home","materi","quiz","arsip"].forEach(x=>{$("view-"+x).hidden = x!==view});
}

/* ---------- Header: kode akses & sinkron ---------- */
$("btnKey").onclick=()=>{
  const cur=getKey();
  const k=prompt("Kode akses saat ini: "+(cur?"(sudah terisi)":"(belum diisi)")+"\nIsi kode akses baru untuk mengganti, atau kosongkan lalu OK untuk menghapus:",cur);
  if(k===null) return;
  setKey(k.trim());
  toast(k.trim()?"Kode akses disimpan":"Kode akses dihapus");
  if(k.trim()) loadData(true);
};
$("btnSync").onclick=()=>loadData(true);


/* ---------- Mulai ---------- */
updateHeaderLevel();
loadCache();
renderAll();
loadData(false);
</script>
</body>
